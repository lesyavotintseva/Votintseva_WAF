# ===== Конфигурация WAF-контейнера =====
# Защита от атаки "Форсированного веб-браузинга" (УБИ.159)

# URL защищаемого backend-приложения (оставьте пустым для demo-режима)
backend_url: ""

# Временное окно для анализа (секунды)
window_seconds: 60

# Пороговые значения (thresholds)
thresholds:
  # Максимальное число уникальных URL от одного IP за окно (основной признак атаки)
  unique_urls: 50
  # Максимальная доля ответов 404 от одного IP (%)
  error_rate_percent: 70.0
  # Минимальное число запросов для применения rate-threshold
  min_requests_for_rate: 10
  # Максимальное число запросов в секунду от одного IP (в рамках окна)
  rps: 30

# Длительность блокировки (секунды, 0 = постоянная)
block_duration_seconds: 3600

# Режим работы:
#   block      — обнаружение + блокировка (production)
#   monitoring — только обнаружение, без блокировки (audit)
#   disabled   — полностью отключён
mode: block

# HTTP-код для заблокированных запросов
response_codes:
  blocked: 403

# Доверенные IP/подсети (никогда не блокируются)
whitelist:
  - "127.0.0.1"
  - "::1"
  # - "10.0.0.0/8"
  # - "192.168.0.0/16"

# Пути, которые не проходят через WAF-анализ
excluded_paths:
  - "/waf/"
  - "/admin/"
  - "/static/"
  - "/favicon.ico"
