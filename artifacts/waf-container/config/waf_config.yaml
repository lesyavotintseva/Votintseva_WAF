# =============================================================================
# КОНФИГУРАЦИЯ WAF-КОНТЕЙНЕРА
# Защита от атаки «Форсированного веб-браузинга» (УБИ.159)
# Аналог модуля Wallarm Forced Browsing Protection
#
# Изменения вступают в силу после перезапуска сервера.
# Путь к файлу задаётся переменной окружения WAF_CONFIG_PATH.
# =============================================================================


# =============================================================================
# БЛОК КОНФИГУРАЦИИ BACKEND-ПРИЛОЖЕНИЯ
# URL защищаемого сервиса, на который WAF проксирует запросы.
# Если оставить пустым — WAF работает в demo-режиме без реального проксирования.
# =============================================================================
backend_url: ""
# Примеры:
#   backend_url: "http://app:8080"        — Docker-сервис по имени
#   backend_url: "http://192.168.1.10:80" — IP-адрес защищаемого сервера
#   backend_url: ""                        — demo-режим (WAF работает сам по себе)


# =============================================================================
# БЛОК ВРЕМЕННОГО ОКНА АНАЛИЗА
# Все счётчики (уникальные URL, 404-ошибки, RPS) считаются за этот период.
# Увеличение window_seconds снижает чувствительность, но уменьшает ложные блокировки.
# =============================================================================
window_seconds: 60   # Размер скользящего окна в секундах (рекомендуется: 30–120)


# =============================================================================
# БЛОК ПОРОГОВЫХ ЗНАЧЕНИЙ (THRESHOLDS)
# Критерии обнаружения атаки форсированного браузинга.
# При превышении ЛЮБОГО из порогов IP блокируется.
# =============================================================================
thresholds:

  # Порог 1 — КОЛИЧЕСТВО УНИКАЛЬНЫХ URL
  # Главный признак атаки: злоумышленник перебирает словарь URL (/admin, /.env, /backup и т.д.)
  # Легитимный пользователь редко обращается к >20 уникальным URL за минуту.
  unique_urls: 50   # IP блокируется при обращении к 50+ уникальным URL за окно

  # Порог 2 — ДОЛЯ ОТВЕТОВ 404 (NOT FOUND)
  # Признак перебора несуществующих ресурсов. Нормальный трафик: <10% ошибок 404.
  error_rate_percent: 70.0   # Блокировка при 70%+ ответов с кодом 404

  # Минимальный порог запросов для активации проверки error_rate_percent.
  # Предотвращает ложные срабатывания при малом числе запросов (1 из 1 = 100%).
  min_requests_for_rate: 10   # Проверять rate только начиная с 10 запросов за окно

  # Порог 3 — ЧАСТОТА ЗАПРОСОВ (RPS)
  # Автоматизированные инструменты (dirbuster, gobuster) работают значительно
  # быстрее человека. 30 RPS = 1800 запросов/минута — явный признак автоматизации.
  rps: 30   # Блокировка при превышении 30 запросов в секунду


# =============================================================================
# БЛОК ДЛИТЕЛЬНОСТИ БЛОКИРОВКИ
# Сколько секунд IP находится в блокировке после обнаружения атаки.
# 0 = постоянная блокировка (требует ручной разблокировки через дашборд).
# =============================================================================
block_duration_seconds: 3600   # 1 час (рекомендуется: 3600–86400)


# =============================================================================
# БЛОК РЕЖИМА РАБОТЫ WAF
# Определяет действие при обнаружении атаки:
#   block      — блокировать IP + логировать (production-режим)
#   monitoring — только логировать, не блокировать (режим аудита/тестирования)
#   disabled   — WAF полностью отключён, все запросы пропускаются
# =============================================================================
mode: block


# =============================================================================
# БЛОК КОДОВ HTTP-ОТВЕТОВ
# HTTP-статус, возвращаемый заблокированным клиентам.
# 403 Forbidden — стандарт для WAF-блокировок.
# =============================================================================
response_codes:
  blocked: 403   # Рекомендуется: 403 (Forbidden) или 429 (Too Many Requests)


# =============================================================================
# БЛОК БЕЛОГО СПИСКА (WHITELIST)
# IP-адреса и подсети, которые НИКОГДА не блокируются.
# Используется для офисных сетей, мониторинговых систем, пентест-команд.
# Поддерживает одиночные IP и CIDR-нотацию (x.x.x.x/mask).
# =============================================================================
whitelist:
  - "127.0.0.1"    # Localhost IPv4 — обязательно для demo-режима
  - "::1"          # Localhost IPv6
  # - "10.0.0.0/8"      # Внутренняя сеть класса A
  # - "192.168.0.0/16"  # Внутренняя сеть класса B
  # - "172.16.0.0/12"   # Docker-подсети


# =============================================================================
# БЛОК ИСКЛЮЧЁННЫХ ПУТЕЙ
# URL-префиксы, которые WAF пропускает без анализа.
# Системные пути Django не должны анализироваться WAF-движком.
# =============================================================================
excluded_paths:
  - "/waf/"       # Сам дашборд WAF — не анализируем (рекурсия)
  - "/admin/"     # Django Admin — отдельная система аутентификации
  - "/static/"    # Статические файлы (CSS, JS, изображения) — не несут угрозы
  - "/favicon.ico"  # Иконка браузера — множество запросов, всегда 200/404
